verbose: false
results_dir: results
run_name: ${now:%Y.%m.%d}${now:%H%M%S}
output_dir: ${results_dir}/${exp_name}/${run_name}${variant_suffix}
db_config:
  _target_: shinka.database.DatabaseConfig
  db_path: evolution_db.sqlite
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.0
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10.0
max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 2
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
  - diff
  - full
  - cross
  patch_type_probs:
  - 0.6
  - 0.3
  - 0.1
  num_generations: 2
  max_patch_resamples: 3
  max_patch_attempts: 1
  llm_models:
  - local/qwen2.5-coder:14b@http://localhost:11434/v1
  llm_dynamic_selection: ucb
  llm_dynamic_selection_kwargs:
    cost_aware_coef: 0.5
  llm_kwargs:
    temperatures:
    - 0.0
    - 0.5
    - 1.0
    max_tokens: 16384
  meta_rec_interval: 10
  embedding_model: local/embeddinggemma@http://localhost:11434/v1
  code_embed_sim_threshold: 0.99
  enable_controlled_oversubscription: false
  results_dir: ${output_dir}
  task_sys_msg: ${py:examples.loco_manipulation.prompts.build_task_sys_msg,${task.scene},${task.initial_condition},${task.description},${task.score_mode},${task.diversity}}
  language: python
  init_program_path: examples/loco_manipulation/initial.py
  full_patch_variants:
  - default
  - different_algorithm
  - context_motivated
  - structural_redesign
  job_type: local
  use_text_feedback: true
  meta_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  novelty_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  prompt_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  max_api_costs: 0.0
task:
  scene: example_scene
  initial_condition: default
  description: pick box1 from the floor and place it on table1 (box1 bottom face in
    contact with table1 top face)
  score_mode: legacy
  diversity: false
evaluate_function:
  _target_: examples.loco_manipulation.evaluate.main
  program_path: ???
  results_dir: ???
  scene: ${task.scene}
  initial_condition: ${task.initial_condition}
  description: ${task.description}
  score_mode: ${task.score_mode}
  diversity: ${task.diversity}
job_config:
  time: 01:15:00
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: ${distributed_job_config.eval_program_path}
distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
  - cuda/12.4
  - cudnn/8.9.7
  - hpcx/2.20
  eval_program_path: shinka/eval_hydra.py
  conda_env: shinka
  time: 01:15:00
  cpus: 1
  gpus: 0
  mem: 4G
exp_name: shinka_loco_manipulation
variant_suffix: _ollama
