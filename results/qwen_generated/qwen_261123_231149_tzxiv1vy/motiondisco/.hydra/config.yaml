verbose: false
results_dir: results
run_name: ${now:%Y.%m.%d}${now:%H%M%S}
output_dir: /mnt/proj1/eu-26-37/it4i-dianyu/Zhengying/motiondisco/results/qwen_generated/qwen_261123_231149_tzxiv1vy/motiondisco
db_config:
  _target_: shinka.database.DatabaseConfig
  db_path: evolution_db.sqlite
  num_islands: 4
  archive_size: 20
  exploitation_ratio: 0.2
  elite_selection_ratio: 0.3
  num_archive_inspirations: 4
  num_top_k_inspirations: 2
  migration_interval: 15
  migration_rate: 0.1
  island_elitism: true
max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 2
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
  - diff
  - full
  patch_type_probs:
  - 0.5
  - 0.5
  num_generations: 10
  max_patch_attempts: 10
  llm_models:
  - local/qwen2.5-coder:14b@http://localhost:11434/v1
  llm_dynamic_selection: null
  embedding_model: local/embeddinggemma@http://localhost:11434/v1
  enable_controlled_oversubscription: false
  results_dir: ${output_dir}
  task_sys_msg: ${py:examples.loco_manipulation.prompts.build_task_sys_msg,${task.scene},${task.initial_condition},${task.description},${task.score_mode},${task.diversity}}
  language: python
  init_program_path: examples/loco_manipulation/scene_generation/walking_seed.py
  full_patch_variants:
  - default
  - different_algorithm
  - context_motivated
  - structural_redesign
  job_type: local
  use_text_feedback: true
  meta_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  novelty_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  prompt_llm_models:
  - local/qwen2.5-coder:7b@http://localhost:11434/v1
  max_api_costs: 100
  evolve_prompts: false
  meta_rec_interval: null
task:
  scene: generated.qwen_261123_231149_tzxiv1vy
  initial_condition: default
  description: Walk the G1 on the floor to world XY (2, 0) metres and finish with
    both soles on the floor. Keep the objects on their initial supports.
  score_mode: quality
  diversity: false
evaluate_function:
  _target_: examples.loco_manipulation.evaluate.main
  program_path: ???
  results_dir: ???
  scene: ${task.scene}
  initial_condition: ${task.initial_condition}
  description: ${task.description}
  score_mode: ${task.score_mode}
  diversity: ${task.diversity}
job_config:
  time: 01:15:00
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: ${distributed_job_config.eval_program_path}
distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
  - cuda/12.4
  - cudnn/8.9.7
  - hpcx/2.20
  eval_program_path: shinka/eval_hydra.py
  conda_env: shinka
  time: 01:15:00
  cpus: 1
  gpus: 0
  mem: 4G
exp_name: shinka_loco_manipulation
variant_suffix: _ollama
