hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task@_global_=loco_manipulation
    - variant@_global_=ollama_local
    - database@_global_=island_small
    - evolution@_global_=small_budget
    - cluster@_global_=local
    - task.scene=generated.qwen_261123_231149_tzxiv1vy
    - task.description="Walk the G1 on the floor to world XY (2, 0) metres and finish
      with both soles on the floor. Keep the objects on their initial supports."
    - task.score_mode=quality
    - evo_config.init_program_path=examples/loco_manipulation/scene_generation/walking_seed.py
    - evo_config.num_generations=10
    - evo_config.max_api_costs=100
    - ++evo_config.evolve_prompts=false
    - ++evo_config.meta_rec_interval=null
    - max_evaluation_jobs=1
    - max_proposal_jobs=1
    - output_dir=/mnt/proj1/eu-26-37/it4i-dianyu/Zhengying/motiondisco/results/qwen_generated/qwen_261123_231149_tzxiv1vy/motiondisco
  job:
    name: launch_hydra
    chdir: null
    override_dirname: ++evo_config.evolve_prompts=false,++evo_config.meta_rec_interval=null,cluster@_global_=local,database@_global_=island_small,evo_config.init_program_path=examples/loco_manipulation/scene_generation/walking_seed.py,evo_config.max_api_costs=100,evo_config.num_generations=10,evolution@_global_=small_budget,max_evaluation_jobs=1,max_proposal_jobs=1,output_dir=/mnt/proj1/eu-26-37/it4i-dianyu/Zhengying/motiondisco/results/qwen_generated/qwen_261123_231149_tzxiv1vy/motiondisco,task.description="Walk
      the G1 on the floor to world XY (2, 0) metres and finish with both soles on
      the floor. Keep the objects on their initial supports.",task.scene=generated.qwen_261123_231149_tzxiv1vy,task.score_mode=quality,task@_global_=loco_manipulation,variant@_global_=ollama_local
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/proj1/eu-26-37/it4i-dianyu/Zhengying/motiondisco
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: shinka.configs
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/proj1/eu-26-37/it4i-dianyu/Zhengying/motiondisco/results/qwen_generated/qwen_261123_231149_tzxiv1vy/motiondisco
    choices:
      variant@_global_: ollama_local
      cluster@_global_: local
      task@_global_: loco_manipulation
      evolution@_global_: small_budget
      database@_global_: island_small
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
